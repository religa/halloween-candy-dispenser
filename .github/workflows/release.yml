name: release

# Push a tag (git tag v1.0.0 && git push origin v1.0.0) to build every part and publish a
# GitHub release with the zip of STL, 3MF and STEP files. README's download link points at
# the latest release's zip, so its name must stay halloween-candy-dispenser-parts.zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (PortAudio for sounddevice, libc++ for ten-vad, OpenGL for the CAD kernel)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libc++1 libgl1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run tools/package_parts.py --zip halloween-candy-dispenser-parts.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Every printed part, ready to slice: `stl/` and `3mf/` to print, `step/` to open in CAD.
          All parts fit a 180 × 180 mm plate (Bambu Lab A1 mini) and print in PLA without supports,
          in the orientation they're exported in. `_test` files are thin fit-check prints: print
          those first. How many of each to print: [Parts](https://github.com/${{ github.repository }}#parts).
          Step by step: [build guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/build-guide.md).
          EOF
          gh release create "$TAG" halloween-candy-dispenser-parts.zip --title "$TAG" --notes-file notes.md --generate-notes
